# DEVELOPMENT CONFIGURATION

# Development Database (Local MySQL)
spring.datasource.url=${MINIFORCE_DB_URL:jdbc:mysql://localhost:3306/miniforce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MINIFORCE_DB_USER:root}
spring.datasource.password=${MINIFORCE_DB_PASSWORD:}

# Safe schema validation
spring.jpa.hibernate.ddl-auto=validate

# JWT Secret - Uses environment variable if present, no unsafe fallback
app.jwt.secret=${MINIFORCE_JWT_SECRET:}

# Dev CORS - Allows local frontend endpoints
app.cors.allowed-origins=${MINIFORCE_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
