spring.application.name=miniforce-api
server.port=${PORT:8080}

# Default to development profile if none specified
spring.profiles.active=dev

# Common safe defaults across all environments
spring.jpa.open-in-view=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
app.jwt.expiration-hours=24
miniforce.judge.real-enabled=true
miniforce.judge.worker-url=${MINIFORCE_JUDGE_WORKER_URL:}
miniforce.judge.internal-secret=${MINIFORCE_JUDGE_INTERNAL_SECRET:}
miniforce.auth.enforce-credential-rotation=${MINIFORCE_ENFORCE_CREDENTIAL_ROTATION:false}
miniforce.admin.initial-password=${MINIFORCE_ADMIN_PASSWORD:}
