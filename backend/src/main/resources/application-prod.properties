# PRODUCTION CONFIGURATION

# Flexible datasource configuration supporting standard Spring, Railway, and custom env vars
spring.datasource.url=${MINIFORCE_DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${MINIFORCE_DB_USER:${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}}
spring.datasource.password=${MINIFORCE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}}

# Production database pool tuning (Hikari)
spring.datasource.hikari.maximum-pool-size=${MINIFORCE_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${MINIFORCE_DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Ensure schema validation, absolutely no creation
spring.jpa.hibernate.ddl-auto=validate

# JWT secret strict (no fallback)
app.jwt.secret=${MINIFORCE_JWT_SECRET}

# Strict CORS for production (requires explicit configuration, no default wildcard)
app.cors.allowed-origins=${MINIFORCE_FRONTEND_ORIGIN:${MINIFORCE_CORS_ORIGINS:}}

# Judge configuration for production
miniforce.judge.real-enabled=${MINIFORCE_JUDGE_REAL_ENABLED:true}
miniforce.judge.scheduler-enabled=${MINIFORCE_JUDGE_SCHEDULER_ENABLED:false}
miniforce.judge.worker-url=${MINIFORCE_JUDGE_WORKER_URL:}
miniforce.judge.internal-secret=${MINIFORCE_JUDGE_INTERNAL_SECRET:}

# Production credential hardening & admin bootstrap
miniforce.auth.enforce-credential-rotation=${MINIFORCE_ENFORCE_CREDENTIAL_ROTATION:true}
miniforce.admin.initial-password=${MINIFORCE_ADMIN_PASSWORD:}

# Production Logging configuration
logging.level.root=INFO
logging.level.com.miniforce=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
