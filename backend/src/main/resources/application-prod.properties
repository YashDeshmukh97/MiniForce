# PRODUCTION CONFIGURATION

# Force environment variables without fallbacks
spring.datasource.url=${MINIFORCE_DB_URL}
spring.datasource.username=${MINIFORCE_DB_USER}
spring.datasource.password=${MINIFORCE_DB_PASSWORD}

# Production database pool tuning (Hikari)
spring.datasource.hikari.maximum-pool-size=${MINIFORCE_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${MINIFORCE_DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Ensure schema validation, absolutely no creation
spring.jpa.hibernate.ddl-auto=validate

# JWT secret strict (no fallback)
app.jwt.secret=${MINIFORCE_JWT_SECRET}

# Strict CORS for production (requires explicit configuration, no default wildcard)
app.cors.allowed-origins=${MINIFORCE_FRONTEND_ORIGIN}

# Production Logging configuration
logging.level.root=INFO
logging.level.com.miniforce=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
