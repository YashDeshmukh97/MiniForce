<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#020617" flood-opacity="0.8" />
    </filter>
    <linearGradient id="fav-bone-grad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="fav-cranium-grad" x1="24" y1="7" x2="24" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F1F5F9" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="fav-rim-violet" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="fav-socket-depth" x1="24" y1="18" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="fav-teeth-grad" x1="24" y1="31" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Crossed Bones -->
  <g opacity="0.95">
    <circle cx="8" cy="8" r="3" fill="url(#fav-bone-grad)" />
    <circle cx="12" cy="6.5" r="2.8" fill="url(#fav-bone-grad)" />
    <circle cx="6.5" cy="12" r="2.8" fill="url(#fav-bone-grad)" />
    <circle cx="40" cy="40" r="3" fill="url(#fav-bone-grad)" />
    <circle cx="41.5" cy="36" r="2.8" fill="url(#fav-bone-grad)" />
    <circle cx="36" cy="41.5" r="2.8" fill="url(#fav-bone-grad)" />
    <path d="M9 11 L37 39 L39 37 L11 9 Z" fill="url(#fav-bone-grad)" stroke="#1E293B" stroke-width="0.5" />

    <circle cx="40" cy="8" r="3" fill="url(#fav-bone-grad)" />
    <circle cx="36" cy="6.5" r="2.8" fill="url(#fav-bone-grad)" />
    <circle cx="41.5" cy="12" r="2.8" fill="url(#fav-bone-grad)" />
    <circle cx="8" cy="40" r="3" fill="url(#fav-bone-grad)" />
    <circle cx="12" cy="41.5" r="2.8" fill="url(#fav-bone-grad)" />
    <circle cx="6.5" cy="36" r="2.8" fill="url(#fav-bone-grad)" />
    <path d="M37 11 L9 39 L11 41 L39 13 Z" fill="url(#fav-bone-grad)" stroke="#1E293B" stroke-width="0.5" />
  </g>

  <!-- Skull -->
  <g filter="url(#fav-shadow)">
    <path d="M14 24 C13 18 16 9 24 9 C32 9 35 18 34 24 C34 27 32.5 28.5 31.5 29 C30.5 29.5 30 31.5 30 33.5 C30 36 29 37.5 28 37.5 L20 37.5 C19 37.5 18 36 18 33.5 C18 31.5 17.5 29.5 16.5 29 C15.5 28.5 14 27 14 24 Z" fill="url(#fav-cranium-grad)" stroke="#0F172A" stroke-width="0.75" />
    <path d="M14.5 23 C13.5 18.5 16.5 10 24 10 C31.5 10 34.5 18.5 33.5 23" stroke="url(#fav-rim-violet)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M17 17 C20 14 28 14 31 17" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8" />
    
    <!-- Orbits -->
    <path d="M17 21 C18.5 19.8 21.5 20.8 22.2 22 C22.6 23.5 21.8 26.2 20.2 26.5 C18.5 26.8 16.5 25 16.2 23.5 C16 22.5 16.5 21.4 17 21 Z" fill="url(#fav-socket-depth)" stroke="#090D16" stroke-width="0.75" />
    <circle cx="18.5" cy="22.5" r="0.6" fill="#818CF8" opacity="0.7" />
    
    <path d="M31 21 C29.5 19.8 26.5 20.8 25.8 22 C25.4 23.5 26.2 26.2 27.8 26.5 C29.5 26.8 31.5 25 31.8 23.5 C32 22.5 31.5 21.4 31 21 Z" fill="url(#fav-socket-depth)" stroke="#090D16" stroke-width="0.75" />
    <circle cx="29.5" cy="22.5" r="0.6" fill="#818CF8" opacity="0.7" />

    <!-- Nasal Cavity -->
    <path d="M24 25.5 C23.2 27.2 22.2 29.2 22.8 29.8 C23.3 30.2 24 29.5 24 29.5 C24 29.5 24.7 30.2 25.2 29.8 C25.8 29.2 24.8 27.2 24 25.5 Z" fill="#090D16" stroke="#1E293B" stroke-width="0.5" />

    <!-- Teeth -->
    <path d="M19 32.5 L29 32.5 L28.5 36.5 L19.5 36.5 Z" fill="url(#fav-teeth-grad)" stroke="#1E293B" stroke-width="0.6" />
    <line x1="21.5" y1="32.5" x2="21.5" y2="36.5" stroke="#0F172A" stroke-width="0.7" />
    <line x1="24" y1="32.5" x2="24" y2="36.5" stroke="#0F172A" stroke-width="0.8" />
    <line x1="26.5" y1="32.5" x2="26.5" y2="36.5" stroke="#0F172A" stroke-width="0.7" />
    <line x1="19.2" y1="34.8" x2="28.8" y2="34.8" stroke="#334155" stroke-width="0.5" opacity="0.6" />
  </g>
</svg>