<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contest - MiniForce</title>
  <link rel="stylesheet" href="miniforce.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo"><span class="logo-mark"><img src="frontend/img/logo.svg" alt="" width="28" height="28"></span>mini<span>force</span></a>
    <div class="nav-links">
      <a href="problems.html">Problems</a>
      <a class="active" href="contests.html">Contests</a>
      <a href="discuss.html">Discuss</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="about.html">About</a>
    </div>
    <button class="mobile-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <div class="nav-buttons">
      <a class="btn-outline" href="login.html">Log In</a>
      <a class="btn-fill" href="signup.html">Sign Up</a>
    </div>
  </nav>

  <main class="page-shell">
    <header class="page-header">
      <h1 class="page-title" id="contest-title">Loading contest...</h1>
      <p class="page-intro" id="contest-desc"></p>
    </header>

    <div class="contest-grid">
      <section>
        <h2 class="panel-title" style="margin:0 0 14px">Problems</h2>
        <div class="panel problem-table">
          <table>
            <thead>
              <tr>
                <th>Problem</th>
                <th>Difficulty</th>
                <th>Points</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="contest-problems">
              <tr>
                <td colspan="4" class="table-state">Loading problems...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <aside>
        <section class="panel side-panel">
          <h3>Leaderboard</h3>
          <div id="contest-leaderboard">
            <p class="caption">Loading leaderboard...</p>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="logo"><span class="logo-mark"><img src="frontend/img/logo.svg" alt="" width="28" height="28"></span>mini<span>force</span></a>
      </div>
      <nav class="footer-nav">
        <a href="problems.html">Problems</a>
        <a href="contests.html">Contests</a>
        <a href="discuss.html">Discuss</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="about.html">About</a>
      </nav>
      <p class="footer-copy">© 2026 MiniForce. Built for coders, by coders.</p>
    </div>
  </footer>

  <script src="frontend/js/api.js"></script>
  <script src="frontend/js/common.js"></script>
  <script src="frontend/js/contest.js"></script>
</body>
</html>
